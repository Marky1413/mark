<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - SINAG MOBILE SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: #f02069 !important;
        }
        .footer {
            background-color: #f1f1f1;
            padding: 20px 0;
            margin-top: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    
    <nav class="navbar navbar-expand-lg navbar-light p-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                

                <h3 class="shining-text"> SINAG MOBILE SHOP</h3>
            </a>
            <form class="d-flex mx-auto" role="search">
                <input class="form-control me-2" type="search" placeholder="Search products..." aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <div class="d-flex align-items-center">
                 <a href="#" class="me-3 text-dark btn btn-outline-primary">Log In</a>
                <a href="#" class="me-3 text-dark btn btn-outline-primary">Home</a>
                <a href="#" class="me-3 text-dark btn btn-outline-primary">Add to Cart</a>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Your Account
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Settings</a></li>
                        <li><a class="dropdown-item" href="#">Logout</a></li>
                         <li><a class="dropdown-item" href="#">Sign Up</a></li>
                          <li><a class="dropdown-item" href="#">Help</a></li>

                    </ul>
                </div>
            </div>
        </div>
    </nav>

   
    <div class="container mt-5">
        <h2>Your Cart</h2>
        <table class="table table-bordered mt-4">
            <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th>Unit Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="cart-items">
               
                <tr>
                    <td>Xiaomi 14T</td>
                    <td>₱24,000</td>
                    <td>1</td>
                    <td>₱24,000</td>
                </tr>
                <tr>
                    <td>Xiaomi 12T</td>
                    <td>₱18,000</td>
                    <td>2</td>
                    <td>₱36,000</td>
                </tr>
            </tbody>
        </table>

        
        <div class="text-end">
            <h4>Total: <span class="text-success fw-bold">₱60,000</span></h4>
            <button class="btn btn-success mt-2">Proceed to Checkout</button>
        </div>
    </div>

    
    <div class="footer">
        <p>&copy; 2025 SINAG MOBILE SHOP. All rights reserved.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
